name: Build and Release Android APK

on:
  push:
    tags:
      - 'v*' # Mandeha isaky ny misy tag toy ny v1.0, v1.2.0, sns.
  workflow_dispatch: # Afaka alefa tànana ihany koa mivantana avy ao amin'ny GitHub UI

jobs:
  build:
    name: Build & Sign Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      # Ny rakitra gradlew dia mety mila "permission" ahafahana mampandeha azy
      - name: Grant Execute Permission for Gradlew
        run: |
          if [ -f "gradlew" ]; then
            chmod +x gradlew
          elif [ -f "../gradlew" ]; then
            chmod +x ../gradlew
          else
            echo "Gradlew wrapper not found in root, setting fallback permissions."
          fi

      # Decrypt-ena ny Keystore avy amin'ny GitHub Secrets ho lasa rakitra .jks indray
      - name: Decode Keystore File
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/my-release-key.jks

      # Manamboatra ny APK mampiasa ny Gradle
      - name: Build Release APK
        run: ./gradlew assembleRelease
        env:
          # Raha mampiasa .env na BuildConfig ny fampiharana dia azonao apetraka eto ny tsiambaratelo
          # GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          pass: dummy # Fisorohana fotsiny

      # Manao sonia ny APK (Signing the APK)
      - name: Sign Release APK
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      # Mampakatra ny rakitra APK ao amin'ny workflow mba ho azo alaina (Artifact)
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: ${{ steps.sign_app.outputs.signedReleaseFile }}

      # Mamorona GitHub Release vaovao ary mametraka ny APK any ho any
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ steps.sign_app.outputs.signedReleaseFile }}
          name: Release ${{ github.ref_name }}
          body: |
            ### Scan Fahana Release ${{ github.ref_name }}
            - Natao sonia soa aman-tsara (Signed APK)
            - Namboarin'i AinaDigit
            - Afaka apetraka amin'ny finday Android rehetra.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
