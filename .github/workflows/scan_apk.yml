name: Build & Release APK

on:
  push:
    tags:
      - 'v*' # Se déclenche lorsqu'un tag commençant par 'v' est poussé (ex: v1.0.0)
  workflow_dispatch: # Permet également de lancer la compilation manuellement depuis GitHub

jobs:
  build:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradle
        run: chmod +x gradlew

      - name: Decode Keystore File
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          # Crée un dossier temporaire et y décode le keystore binaire
          mkdir -p tmp
          echo "$KEYSTORE_BASE64" | base64 --decode > tmp/release-key.jks

      - name: Build Release APK
        env:
          # On injecte les secrets dans l'environnement de build pour Gradle
          KEYSTORE_FILE_PATH: ../tmp/release-key.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Clean Temporary Keystore
        if: always()
        run: rm -rf tmp # Par mesure de sécurité absolue, supprime la clé extraite

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: app/build/outputs/apk/release/app-release.apk
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
