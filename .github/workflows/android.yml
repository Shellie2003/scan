name: Android Release Build

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Allows manual trigger

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Regenerate Gradle Wrapper
        run: gradle wrapper

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Create empty .env file
        run: touch .env

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Error: KEYSTORE_BASE64 secret is missing or empty!"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > app/release.jks

      - name: Verify Keystore Alias (Diagnostic)
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          echo "=== Keystore Content Diagnostic ==="
          if [ -f app/release.jks ]; then
            keytool -list -v -keystore app/release.jks -storepass "$STORE_PASSWORD" | grep -i "Alias" || echo "Could not parse keystore"
          else
            echo "Keystore file not found!"
          fi
          echo "==================================="

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build and Sign Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/app/release.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          # Every build gets a higher version code than the one before, so an
          # APK can always be installed over the previous release.
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: ./gradlew :app:assembleRelease

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          # Builds used to pile up until the storage quota of the account was
          # full and no APK could be uploaded at all. A week is long enough to
          # install a build, and short enough that they stop accumulating.
          retention-days: 7

      # Run after the APK is built and uploaded: a failing test must be visible
      # without costing the build the only installable artifact it produces.
      # Only the logic suites — the screenshot test needs a recorded reference.
      - name: Unit Tests (logic)
        env:
          # The same environment as the build: the release variant is configured
          # from it, and a step without it would configure a signing config
          # pointing at a keystore that is not there.
          KEYSTORE_PATH: ${{ github.workspace }}/app/release.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          # The Android plugin renames the unit test task between its major
          # versions — testReleaseUnitTest does not exist under AGP 9 — so the
          # name is asked for rather than guessed, and printed either way.
          set -o pipefail
          CANDIDATES=$(./gradlew :app:tasks --all -q \
            | grep -oE '^test[A-Za-z]+(UnitTest|HostTest)' | sort -u || true)
          echo "Unit test tasks in :app: ${CANDIDATES:-none}"
          TASK=$(echo "$CANDIDATES" | grep -i release | head -1 || true)
          if [ -z "$TASK" ]; then TASK=$(echo "$CANDIDATES" | head -1 || true); fi
          if [ -z "$TASK" ]; then
            echo "No unit test task exposed by the Android plugin."
            exit 1
          fi
          ./gradlew ":app:$TASK" \
            --tests "com.example.TelephonyLogicTest" \
            --tests "com.example.TranslationsTest" \
            --tests "com.example.ConversationLockTest"
